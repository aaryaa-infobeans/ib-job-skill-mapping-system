# Docker Compose Test Environment
# Purpose: Provides PostgreSQL database for integration tests
# Usage:
#   Start: docker-compose -f docker-compose.test.yml up -d
#   Stop: docker-compose -f docker-compose.test.yml down -v

version: '3.8'

services:
  postgres-test:
    image: postgres:15-alpine
    container_name: ib-job-skill-mapping-postgres-test
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: ib_job_skill_mapping_test
      POSTGRES_INITDB_ARGS: "--encoding=UTF8 --locale=en_US.UTF-8"
    ports:
      - "5434:5432"  # Map to 5434 to avoid conflict with local PostgreSQL or other test DB
    volumes:
      - postgres-test-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d ib_job_skill_mapping_test"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - test-network
    restart: unless-stopped

networks:
  test-network:
    driver: bridge

volumes:
  postgres-test-data:
    driver: local
