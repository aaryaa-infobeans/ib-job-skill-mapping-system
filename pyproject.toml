[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ib-job-skill-mapping-system"
version = "0.1.0"
description = "Job skill mapping system with AI-powered matching"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.104.0",
    "uvicorn[standard]>=0.24.0",
    "sqlalchemy>=2.0.0",
    "alembic>=1.12.0",
    "psycopg2-binary>=2.9.9",
    "pydantic>=2.5.0",
    "pydantic-settings>=2.1.0",
    "python-jose[cryptography]>=3.3.0",
    "passlib[bcrypt]>=1.7.4",
    "python-multipart>=0.0.6",
    "langgraph>=0.0.1",
    "langchain>=0.1.0",
    "langchain-openai>=0.0.1",
    # Ingestion Service Dependencies
    "requests>=2.31.0",
    "authlib>=1.3.0",
    "structlog>=23.1.0",
    "pgvector==0.4.2",
    "trulens>=2.7.2",
    "trulens-providers-openai>=2.2.2",
    "trulens-apps-langchain>=2.7.2",
    "trulens-providers-google>=2.7.2",
    "groq>=1.2.0",
    "jwt>=1.4.0",
    "sentence-transformers>=5.4.1",
    "mcp[cli]>=1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.3",
    "pytest-asyncio>=0.21.1",
    "pytest-cov>=4.1.0",
    "pytest-mock>=3.12.0",
    "responses>=0.24.1",
    "coverage[toml]>=7.4.0",
    "httpx>=0.25.2",
    "black>=23.12.0",
    "ruff>=0.1.8",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.black]
line-length = 100
target-version = ["py311"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
markers = [
    "smoke: quick smoke tests for CI (<60s)",
    "performance: performance benchmark tests",
    "slow: tests that take significant time",
]

[tool.coverage.run]
source = ["src/app/cron"]
omit = [
    "*/tests/*",
    "*/test_*.py",
    "*/__init__.py"
]

[tool.coverage.report]
fail_under = 85
precision = 2
show_missing = true
skip_covered = false

[tool.coverage.html]
directory = "htmlcov"

[tool.coverage.xml]
output = "coverage.xml"

[dependency-groups]
dev = [
    "pytest>=9.0.3",
]
