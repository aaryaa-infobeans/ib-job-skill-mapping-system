apiVersion: v1
kind: Namespace
metadata:
  name: production
  labels:
    name: production
    environment: production

---
# Blue Deployment
apiVersion: apps/v1
kind: Deployment
metadata:
  name: api-gateway-blue
  namespace: production
  labels:
    app: api-gateway
    version: blue
    environment: production
spec:
  replicas: 3
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0  # Zero-downtime
  selector:
    matchLabels:
      app: api-gateway
      version: blue
  template:
    metadata:
      labels:
        app: api-gateway
        version: blue
        environment: production
    spec:
      serviceAccountName: api-service-account
      
      # Pod anti-affinity for high availability
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                labelSelector:
                  matchExpressions:
                    - key: app
                      operator: In
                      values:
                        - api-gateway
                topologyKey: kubernetes.io/hostname
      
      containers:
        - name: api-gateway
          image: <ECR_REGISTRY>/ib-job-skill-mapping:latest  # Replaced during deployment
          imagePullPolicy: Always
          
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
          
          env:
            - name: ENVIRONMENT
              value: "production"
            - name: LOG_LEVEL
              value: "INFO"
            - name: AWS_REGION
              value: "us-east-1"
            
            # Database connection (from Terraform outputs)
            - name: DATABASE_HOST
              valueFrom:
                configMapKeyRef:
                  name: app-config
                  key: database_host
            - name: DATABASE_PORT
              valueFrom:
                configMapKeyRef:
                  name: app-config
                  key: database_port
            - name: DATABASE_NAME
              valueFrom:
                configMapKeyRef:
                  name: app-config
                  key: database_name
            
            # Redis connection
            - name: REDIS_HOST
              valueFrom:
                configMapKeyRef:
                  name: app-config
                  key: redis_host
            - name: REDIS_PORT
              valueFrom:
                configMapKeyRef:
                  name: app-config
                  key: redis_port
            
            # Secrets Manager ARNs (application retrieves actual secrets)
            - name: DATABASE_PASSWORD_ARN
              valueFrom:
                configMapKeyRef:
                  name: app-config
                  key: database_password_arn
            - name: REDIS_AUTH_ARN
              valueFrom:
                configMapKeyRef:
                  name: app-config
                  key: redis_auth_arn
            - name: OAUTH_SECRET_ARN
              valueFrom:
                configMapKeyRef:
                  name: app-config
                  key: oauth_secret_arn
            - name: LLM_KEYS_ARN
              valueFrom:
                configMapKeyRef:
                  name: app-config
                  key: llm_keys_arn
            - name: APP_SECRETS_ARN
              valueFrom:
                configMapKeyRef:
                  name: app-config
                  key: app_secrets_arn
          
          resources:
            requests:
              cpu: 500m
              memory: 1Gi
            limits:
              cpu: 2000m
              memory: 4Gi
          
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 30
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          
          readinessProbe:
            httpGet:
              path: /health/ready
              port: http
            initialDelaySeconds: 15
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 2
          
          startupProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 0
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 30  # 5 minutes to start

---
# Green Deployment (current production)
apiVersion: apps/v1
kind: Deployment
metadata:
  name: api-gateway-green
  namespace: production
  labels:
    app: api-gateway
    version: green
    environment: production
spec:
  replicas: 3
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app: api-gateway
      version: green
  template:
    metadata:
      labels:
        app: api-gateway
        version: green
        environment: production
    spec:
      serviceAccountName: api-service-account
      
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                labelSelector:
                  matchExpressions:
                    - key: app
                      operator: In
                      values:
                        - api-gateway
                topologyKey: kubernetes.io/hostname
      
      containers:
        - name: api-gateway
          image: <ECR_REGISTRY>/ib-job-skill-mapping:latest
          imagePullPolicy: Always
          
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
          
          env:
            - name: ENVIRONMENT
              value: "production"
            - name: LOG_LEVEL
              value: "INFO"
            - name: AWS_REGION
              value: "us-east-1"
            
            - name: DATABASE_HOST
              valueFrom:
                configMapKeyRef:
                  name: app-config
                  key: database_host
            - name: DATABASE_PORT
              valueFrom:
                configMapKeyRef:
                  name: app-config
                  key: database_port
            - name: DATABASE_NAME
              valueFrom:
                configMapKeyRef:
                  name: app-config
                  key: database_name
            
            - name: REDIS_HOST
              valueFrom:
                configMapKeyRef:
                  name: app-config
                  key: redis_host
            - name: REDIS_PORT
              valueFrom:
                configMapKeyRef:
                  name: app-config
                  key: redis_port
            
            - name: DATABASE_PASSWORD_ARN
              valueFrom:
                configMapKeyRef:
                  name: app-config
                  key: database_password_arn
            - name: REDIS_AUTH_ARN
              valueFrom:
                configMapKeyRef:
                  name: app-config
                  key: redis_auth_arn
            - name: OAUTH_SECRET_ARN
              valueFrom:
                configMapKeyRef:
                  name: app-config
                  key: oauth_secret_arn
            - name: LLM_KEYS_ARN
              valueFrom:
                configMapKeyRef:
                  name: app-config
                  key: llm_keys_arn
            - name: APP_SECRETS_ARN
              valueFrom:
                configMapKeyRef:
                  name: app-config
                  key: app_secrets_arn
          
          resources:
            requests:
              cpu: 500m
              memory: 1Gi
            limits:
              cpu: 2000m
              memory: 4Gi
          
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 30
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          
          readinessProbe:
            httpGet:
              path: /health/ready
              port: http
            initialDelaySeconds: 15
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 2
          
          startupProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 0
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 30

---
# Production Service (switches between blue and green)
apiVersion: v1
kind: Service
metadata:
  name: api-gateway
  namespace: production
  labels:
    app: api-gateway
    environment: production
  annotations:
    service.beta.kubernetes.io/aws-load-balancer-type: "nlb"
    service.beta.kubernetes.io/aws-load-balancer-cross-zone-load-balancing-enabled: "true"
spec:
  type: LoadBalancer
  selector:
    app: api-gateway
    version: green  # Initially points to green, switches to blue during deployment
  ports:
    - name: http
      port: 80
      targetPort: http
      protocol: TCP
  sessionAffinity: ClientIP
  sessionAffinityConfig:
    clientIP:
      timeoutSeconds: 10800  # 3 hours

---
# Blue Service (for testing before traffic switch)
apiVersion: v1
kind: Service
metadata:
  name: api-gateway-blue
  namespace: production
  labels:
    app: api-gateway
    version: blue
spec:
  type: ClusterIP
  selector:
    app: api-gateway
    version: blue
  ports:
    - name: http
      port: 80
      targetPort: http
      protocol: TCP

---
# Green Service (for rollback)
apiVersion: v1
kind: Service
metadata:
  name: api-gateway-green
  namespace: production
  labels:
    app: api-gateway
    version: green
spec:
  type: ClusterIP
  selector:
    app: api-gateway
    version: green
  ports:
    - name: http
      port: 80
      targetPort: http
      protocol: TCP

---
# Horizontal Pod Autoscaler
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: api-gateway-blue
  namespace: production
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: api-gateway-blue
  minReplicas: 3
  maxReplicas: 10
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
    - type: Resource
      resource:
        name: memory
        target:
          type: Utilization
          averageUtilization: 80

---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: api-gateway-green
  namespace: production
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: api-gateway-green
  minReplicas: 3
  maxReplicas: 10
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
    - type: Resource
      resource:
        name: memory
        target:
          type: Utilization
          averageUtilization: 80

---
# Pod Disruption Budget
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: api-gateway
  namespace: production
spec:
  minAvailable: 2
  selector:
    matchLabels:
      app: api-gateway

---
# Service Account with IRSA for Secrets Manager access
apiVersion: v1
kind: ServiceAccount
metadata:
  name: api-service-account
  namespace: production
  annotations:
    eks.amazonaws.com/role-arn: arn:aws:iam::ACCOUNT_ID:role/api-secrets-access-role

---
# ConfigMap with non-sensitive configuration
apiVersion: v1
kind: ConfigMap
metadata:
  name: app-config
  namespace: production
data:
  # Database configuration
  database_host: "ib-job-skill-mapping-prod-db.xxxxx.us-east-1.rds.amazonaws.com"
  database_port: "5432"
  database_name: "ib_job_skill_mapping"
  database_password_arn: "arn:aws:secretsmanager:us-east-1:ACCOUNT_ID:secret:ib-job-skill-mapping-prod-db-master-password-xxxxx"
  
  # Redis configuration
  redis_host: "ib-job-skill-mapping-prod-redis.xxxxx.cache.amazonaws.com"
  redis_port: "6379"
  redis_auth_arn: "arn:aws:secretsmanager:us-east-1:ACCOUNT_ID:secret:ib-job-skill-mapping-prod-redis-credentials-xxxxx"
  
  # Secrets Manager ARNs
  oauth_secret_arn: "arn:aws:secretsmanager:us-east-1:ACCOUNT_ID:secret:ib-job-skill-mapping-prod-oauth-client-xxxxx"
  llm_keys_arn: "arn:aws:secretsmanager:us-east-1:ACCOUNT_ID:secret:ib-job-skill-mapping-prod-llm-api-keys-xxxxx"
  app_secrets_arn: "arn:aws:secretsmanager:us-east-1:ACCOUNT_ID:secret:ib-job-skill-mapping-prod-application-secrets-xxxxx"
  
  # Application configuration
  log_level: "INFO"
  environment: "production"
